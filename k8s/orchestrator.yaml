apiVersion: apps/v1
kind: Deployment
metadata:
  name: codemender-orchestrator
  namespace: default
  labels:
    app: codemender-orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: codemender-orchestrator
  template:
    metadata:
      labels:
        app: codemender-orchestrator
    spec:
      serviceAccountName: codemender-orchestrator-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
      - name: orchestrator
        image: ${LOCATION}-docker.pkg.dev/${PROJECT_ID}/cm-sandbox-repo/codemender-orchestrator:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: K8S_NAMESPACE
          value: "default"
        - name: SANDBOX_TEMPLATE_NAME
          value: "codemender-template"
        - name: SANDBOX_WARMPOOL_NAME
          value: "codemender-warmpool"
        - name: OUT_BUCKET
          value: "${OUT_BUCKET}"
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 20
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: codemender-orchestrator-svc
  namespace: default
  labels:
    app: codemender-orchestrator
spec:
  type: ClusterIP
  selector:
    app: codemender-orchestrator
  ports:
  - name: http
    port: 80
    targetPort: 8080
