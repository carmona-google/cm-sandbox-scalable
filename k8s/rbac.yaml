apiVersion: v1
kind: ServiceAccount
metadata:
  name: codemender-sa
  namespace: default
  annotations:
    iam.gke.io/gcp-service-account: "cm-sandbox-sa@${PROJECT_ID}.iam.gserviceaccount.com"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: codemender-orchestrator-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: codemender-orchestrator-role
  namespace: default
rules:
- apiGroups: ["extensions.agents.x-k8s.io", "agents.x-k8s.io"]
  resources: ["sandboxclaims", "sandboxes", "sandboxwarmpools"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods/exec"]
  verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: codemender-orchestrator-binding
  namespace: default
subjects:
- kind: ServiceAccount
  name: codemender-orchestrator-sa
  namespace: default
roleRef:
  kind: Role
  name: codemender-orchestrator-role
  apiGroup: rbac.authorization.k8s.io
