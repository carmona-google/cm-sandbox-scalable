apiVersion: extensions.agents.x-k8s.io/v1alpha1
kind: SandboxTemplate
metadata:
  name: codemender-template
  namespace: default
spec:
  networkPolicyManagement: Unmanaged
  podTemplate:
    metadata:
      labels:
        sandbox-type: codemender-runtime
      annotations:
        gke-gcsfuse/volumes: "true"
    spec:
      # Set to false to comply with secure-sandbox-policy
      automountServiceAccountToken: false
      dnsPolicy: ClusterFirst
      containers:
      - args:
        - |
          # Symlink the binary for easier access
          ln -sf /opt/codemender/codemender-cli-v0.1.0-20260515-vMvg-916238397/linux-amd64/cm-linux /usr/local/bin/cm
          
          # Initialize workspace if not already present
          if [ ! -d "/home/codemender/.codemender" ]; then
            /usr/local/bin/cm init
          fi
          
          # Apply custom configuration
          cp /tmp/config/config.yaml /home/codemender/.codemender/config.yaml
          
          sleep 3600000
        command:
        - /bin/sh
        - -c
        image: ${LOCATION}-docker.pkg.dev/${PROJECT_ID}/cm-sandbox-repo/codemender-worker:latest
        imagePullPolicy: Always
        name: codemender-worker
        resources:
          limits:
            cpu: 2000m
            memory: 4Gi
            ephemeral-storage: 10Gi
          requests:
            cpu: 1000m
            memory: 2Gi
            ephemeral-storage: 5Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        # Fast node-local SSD workspace to stage code before running cm
        # Eliminates GCS FUSE latency and avoids ReadWriteOnce multi-attach bottlenecks
        - mountPath: /workspace/local-work
          name: codemender-local-work
        - name: gcs-fuse-src
          mountPath: /workspace/src
        - name: gcs-fuse-out
          mountPath: /workspace/out
        - mountPath: /tmp/config
          name: codemender-config
      nodeSelector:
        sandbox.gke.io/runtime: gvisor
      restartPolicy: OnFailure
      runtimeClassName: gvisor
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      serviceAccountName: codemender-sa
      tolerations:
      - effect: NoSchedule
        key: sandbox.gke.io/runtime
        value: gvisor
      volumes:
      - name: codemender-local-work
        emptyDir:
          sizeLimit: 10Gi
      - name: gcs-fuse-src
        csi:
          driver: gcsfuse.csi.storage.gke.io
          volumeAttributes:
            bucketName: ${SRC_BUCKET}
            mountOptions: "implicit-dirs,metadata-cache:ttl-secs:3600,file-cache:max-size-mb:1024"
            skipCSIBucketAccessCheck: "true"
      - name: gcs-fuse-out
        csi:
          driver: gcsfuse.csi.storage.gke.io
          volumeAttributes:
            bucketName: ${OUT_BUCKET}
            mountOptions: "implicit-dirs"
            skipCSIBucketAccessCheck: "true"
      - name: codemender-config
        configMap:
          name: codemender-config
